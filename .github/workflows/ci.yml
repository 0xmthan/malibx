name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Lint, format and security audit. Runs on every push and PR.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo audit

  # 2. Read the version from Cargo.toml and check if it's already released.
  version:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "v$v already released, skipping"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$v is new, releasing"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # 3. Build one wheel per platform (abi3: works on any Python >= 3.11).
  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-14, target: aarch64 }
          - { os: macos-14, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  # 4. Publish to PyPI (trusted publishing, no token), then create the GitHub
  #    release with all wheels attached. PyPI goes first and skips files that
  #    are already there, so a failed run can simply be re-run.
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$V" dist/*.whl \
            -R "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v$V" \
            --generate-notes
