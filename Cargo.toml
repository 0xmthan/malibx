[package]
name = "malibx"
version = "0.5.44"
edition = "2024"
license = "MIT"

[lib]
name = "malibx"
crate-type = ["cdylib"]

[dependencies]
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
minifb = "0.29.0"
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
raw-window-handle = "0.6"

# Default window icon (src/icon.rs), screen size and pointer warping (src/platform.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSScreen", "NSView", "NSWindow"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "libc", "CGError", "CGRemoteOperation"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "windef"] }
