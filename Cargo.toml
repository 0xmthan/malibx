[package]
name = "malibx"
version = "0.4.27"
edition = "2024"
license = "MIT"

[lib]
name = "malibx"
crate-type = ["cdylib"]

[dependencies]
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
minifb = "0.29.0"
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }

# Default window icon (see src/icon.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
